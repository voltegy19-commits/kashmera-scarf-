<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلبات Kashmera</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #f7f8fb; margin: 0; padding: 0; color: #12213a; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .page-header { text-align: center; margin-bottom: 24px; }
    .page-header h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); }
    .page-header p { color: #55617d; margin: 12px 0 0; }
    .orders-grid { display: grid; gap: 18px; }
    .order-card { background: white; border: 1px solid #e4e8f2; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(24, 39, 91, 0.06); }
    .order-card h2 { margin: 0 0 8px; font-size: 18px; }
    .order-meta { display: grid; grid-template-columns: repeat(2, minmax(180px,1fr)); gap: 12px; margin-bottom: 16px; }
    .order-meta div { background: #f7f8fb; border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.5; }
    .order-meta strong { display: block; margin-bottom: 4px; color: #33415b; }
    .items-list { border-top: 1px solid #e4e8f2; padding-top: 14px; }
    .item-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f0f3fa; }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-weight: 700; color: #17233d; }
    .item-detail { color: #5f6a7d; font-size: 13px; }
    .item-price { text-align: left; color: #d63384; font-weight: 800; }
    .delete-btn { margin-top: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #d63333; color: white; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 700; transition: background .2s; }
    .delete-btn:hover { background: #a82727; }
    .empty-state { text-align: center; margin-top: 60px; color: #5f6a7d; }
    .view-link { display: inline-block; margin-top: 12px; text-decoration: none; color: #ffffff; background: #ff2d95; padding: 10px 18px; border-radius: 999px; }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    .top-actions button { cursor: pointer; font-weight: 700; border: none; border-radius: 999px; padding: 10px 16px; background: #1c3b82; color: white; transition: background .2s; }
    .top-actions button:hover { background: #132a63; }
    .status-chip { display: inline-flex; align-items: center; gap: 8px; background: #eef5ff; color: #1c3b82; padding: 8px 12px; border-radius: 999px; font-size: 13px; }
    @media(max-width:760px){ .order-meta { grid-template-columns: 1fr; } .item-row { grid-template-columns: 1fr; } .item-price { text-align: right; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>قائمة الطلبات</h1>
      <p>عرض منظم لكل الطلبات المرسلة عبر الموقع.</p>
    </div>
    <div class="top-actions">
      <div class="status-chip">الطلبات العديدة تظهر أسفل</div>
      <button onclick="loadOrders()">تحديث الطلبات</button>
    </div>
    <div id="orders" class="orders-grid"></div>
    <div id="empty" class="empty-state" style="display:none;">
      لا توجد طلبات محفوظة حالياً.
      <br>
      افتح صفحة الدفع وأرسل طلب لتظهر هنا.
    </div>
  </div>

  <script>
    async function loadOrders() {
      const container = document.getElementById('orders');
      const empty = document.getElementById('empty');
      container.innerHTML = '<p style="padding:20px;font-size:15px;color:#5f6a7d;">جاري تحميل الطلبات...</p>';
      try {
        const response = await fetch('/api/orders');
        if (!response.ok) throw new Error('فشل في جلب الطلبات');
        const orders = await response.json();
        if (!orders || !orders.length) {
          container.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        container.innerHTML = orders.map(order => renderOrder(order)).join('');
      } catch (error) {
        container.innerHTML = '<p style="padding:20px;color:#bf1650;">حدث خطأ أثناء تحميل الطلبات. تأكد من تشغيل السيرفر.</p>';
        empty.style.display = 'none';
        console.error(error);
      }
    }

    function renderOrder(order) {
      const customer = order.customer || {};
      const items = Array.isArray(order.items) ? order.items : [];
      const payment = order.payment === 'cod' ? 'الدفع عند الاستلام' : 'إنستا باي / فودافون كاش';
      const shipping = order.shipping === 0 ? 'مجاني' : order.shipping + ' جنيه';
      return `
        <div class="order-card">
          <h2>طلب رقم ${order.id || 'غير محدد'}</h2>
          <div class="order-meta">
            <div><strong>تاريخ الطلب</strong>${order.date || order.createdAt || 'غير معروف'}</div>
            <div><strong>الحالة</strong>${order.status || 'جديد'}</div>
            <div><strong>اسم العميل</strong>${customer.name || 'غير متوفر'}</div>
            <div><strong>الهاتف</strong>${customer.phone || 'غير متوفر'}</div>
            <div><strong>المحافظة</strong>${customer.gov || 'غير محددة'}</div>
            <div><strong>المدينة</strong>${customer.city || 'غير محددة'}</div>
            <div><strong>العنوان</strong>${customer.addr || 'غير محدد'}</div>
            <div><strong>طريقة الدفع</strong>${payment}</div>
            <div><strong>الشحن</strong>${shipping}</div>
            <div><strong>الإجمالي</strong>${order.total || '0'} جنيه</div>
          </div>
          <div class="items-list">
            <h3 style="margin:0 0 10px;font-size:15px;color:#33415b">المنتجات</h3>
            ${items.map(item => `
              <div class="item-row">
                <div>
                  <div class="item-name">${item.name || 'منتج غير معروف'}</div>
                  <div class="item-detail">${item.color ? 'اللون: ' + item.color + ' ، ' : ''}الكمية: ${item.qty || item.quantity || 1}</div>
                </div>
                <div class="item-price">${(Number(item.price)||0) * (item.qty||item.quantity||1)} ج</div>
              </div>
            `).join('')}
          </div>
          ${customer.notes ? `<p style="margin-top:14px;color:#5f6a7d;font-size:14px;"><strong>ملاحظات العميل:</strong> ${customer.notes}</p>` : ''}
          <button class="delete-btn" onclick="deleteOrder('${order.id}')">حذف الطلب</button>
        </div>
      `;
    }

    async function deleteOrder(orderId) {
      if (!orderId) return;
      const confirmed = confirm('هل أنت متأكد أنك تريد حذف هذا الطلب؟');
      if (!confirmed) return;
      try {
        const response = await fetch(`/api/orders/${orderId}`, { method: 'DELETE' });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || 'فشل حذف الطلب');
        }
        await loadOrders();
      } catch (error) {
        alert('حدث خطأ أثناء حذف الطلب. حاول مرة أخرى.');
        console.error(error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
